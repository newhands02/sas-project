server {
    listen 8082;
    server_name localhost;

    # 处理 /manage/ 前缀的请求
    location /manage/ {
        # 实际文件路径为 /usr/share/nginx/html/manage
        alias /usr/share/nginx/html/manage/;
        index index.html index.htm;
        # 支持 Vue 路由（刷新页面时重定向到 index.html）
        try_files $uri $uri/ /manage/index.html;
    }

    # 根路径重定向到 /manage/（可选，方便直接访问 localhost:8082）
    location / {
        return 301 /manage/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}